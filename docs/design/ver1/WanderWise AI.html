function genPoints() {
  let s=42
  const rnd=()=>{s=((s*1664525+1013904223)>>>0);return s/4294967296}
  const pts=[]
  CLUSTERS.forEach(cl=>{
    for(let i=0;i<cl.n;i++){
      const a=rnd()*Math.PI*2, r=rnd()*26+4
      pts.push({x:cl.cx+Math.cos(a)*r, y:cl.cy+Math.sin(a)*r, color:cl.color, label:cl.label})
    }
  })
  return pts
}
const VPOINTS = genPoints()

/* ─── HELPERS ─────────────────────────────────────────────── */
function groupSessions(sessions) {
  const todayMs = new Date().setHours(0,0,0,0)
  const groups = [{label:'今日',items:[]},{label:'昨日',items:[]},{label:'過去 7 日',items:[]},{label:'過去 30 日',items:[]},{label:'それ以前',items:[]}]
  sessions.forEach(s=>{
    const ms=new Date(s.updated_at).getTime()
    const ds=new Date(s.updated_at).setHours(0,0,0,0)
    if(ds>=todayMs)               groups[0].items.push(s)
    else if(ds>=todayMs-86400000) groups[1].items.push(s)
    else if(ms>=todayMs-7*86400000)  groups[2].items.push(s)
    else if(ms>=todayMs-30*86400000) groups[3].items.push(s)
    else                          groups[4].items.push(s)
  })
  return groups.filter(g=>g.items.length>0)
}

function formatExtractionData(data) {
  const parts = []
  if(data.name)    parts.push(data.name)
  if(data.type)    parts.push(data.type)
  if(data.location||data.target) parts.push(data.location||data.target)
  if(data.from && data.to) parts.push(`${data.from}→${data.to}`)
  if(data.amount)  parts.push(`¥${data.amount.toLocaleString()}`)
  if(data.content) return data.content.slice(0,40)+(data.content.length>40?'…':'')
  if(data.start)   parts.push(`${data.start}〜${data.end}`)
  return parts.filter(Boolean).join(' · ')
}

function ChatPage() {
  const [sessions, setSessions] = useState(SESSIONS_INIT)
  const [currId, setCurrId] = useState('s1')
  const [msgs, setMsgs] = useState(INIT_MSGS['s1']||[])
  const [allExtractions, setAllExtractions] = useState(
    Object.values(EXTRACTIONS_INIT).flat().reduce((acc,ex)=>{acc[ex.id]=ex;return acc},{})
  )
  const [sessionExtractions, setSessionExtractions] = useState(EXTRACTIONS_INIT)
  const [input, setInput] = useState('')
  const [loading, setLoading] = useState(false)
  const [editId, setEditId] = useState(null)
  const [editTitle, setEditTitle] = useState('')
  const [hoverId, setHoverId] = useState(null)
  const [showPanel, setShowPanel] = useState(true)
  const [compareQuery, setCompareQuery] = useState(null)
  const [replyIdx, setReplyIdx] = useState(0)
  const scrollRef = useRef(null)
  const taRef = useRef(null)

  /* 現セッションの全抽出IDを集める */
  const currExtractionIds = useMemo(()=>{
    return (msgs||[]).flatMap(m=>m.extractions||[])
  },[msgs])

  useEffect(()=>{
    if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight
  },[msgs,loading])

  useEffect(()=>{
    if(!taRef.current) return
    taRef.current.style.height='auto'
    taRef.current.style.height=Math.min(taRef.current.scrollHeight,160)+'px'
  },[input])

  const switchSession = useCallback(id=>{
    setCurrId(id); setInput('')
    setMsgs(INIT_MSGS[id]||[{role:'assistant',content:'こんにちは！旅行についてお話ししましょう。',time:'',extractions:[]}])
  },[])

  const newSession = ()=>{
    const id='n'+Date.now()
    setSessions(p=>[{id,title:'新しいチャット',updated_at:new Date()},...p])
    setSessionExtractions(p=>({...p,[id]:[]}))
    setCurrId(id); setInput('')
    setMsgs([{role:'assistant',content:'こんにちは！旅行についてお話ししましょう。最近行った場所や、行きたい場所について教えてください。',time:'',extractions:[]}])
  }

  const delSession=(id,e)=>{
    e.stopPropagation()
    const next=sessions.filter(s=>s.id!==id)
    setSessions(next)
    if(currId===id){ if(next.length>0) switchSession(next[0].id); else newSession() }
  }

  const handleSend=()=>{
    if(!input.trim()||loading) return
    const t=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
    const txt=input.trim()
    setMsgs(p=>[...p,{role:'user',content:txt,time:t,extractions:[]}])
    setInput('')
    setLoading(true)
    const curr=sessions.find(s=>s.id===currId)
    if(curr?.title==='新しいチャット'){
      setSessions(p=>p.map(s=>s.id===currId?{...s,title:txt.slice(0,22)+(txt.length>22?'…':''),updated_at:new Date()}:s))
    }
    const pool=AI_REPLIES_POOL[replyIdx%AI_REPLIES_POOL.length]
    setReplyIdx(i=>i+1)
    setTimeout(()=>{
      const t2=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
      /* 新しい抽出データをグローバルに追加 */
      const newExIds=[]
      const newExMap={}
      pool.extractions_new.forEach(ex=>{
        const id='ex_'+Date.now()+'_'+Math.random().toString(36).slice(2)
        newExIds.push(id)
        newExMap[id]={...ex,id}
      })
      setAllExtractions(p=>({...p,...newExMap}))
      setSessionExtractions(p=>({...p,[currId]:[...(p[currId]||[]),...Object.values(newExMap)]}))
      setMsgs(p=>[...p,{role:'assistant',content:pool.content,time:t2,extractions:newExIds}])
      setLoading(false)
    },1000+Math.random()*600)
  }

  const groups=useMemo(()=>groupSessions(sessions),[sessions])

  /* 直近メッセージの抽出 */
  const lastMsgExtractions = useMemo(()=>{
    const last=[...msgs].reverse().find(m=>m.role==='assistant'&&(m.extractions||[]).length>0)
    return last ? last.extractions : []
  },[msgs])

  return (
    <div className="page-enter" style={{height:'100vh',display:'flex',flexDirection:'column',paddingTop:60}}>
      {compareQuery && <RagCompareModal query={compareQuery} onClose={()=>setCompareQuery(null)}/>}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>

        {/* ── Sidebar ── */}
        <aside style={{width:240,flexShrink:0,display:'flex',flexDirection:'column',background:'#0c0c0c',borderRight:`1px solid ${C.border}`}}>
          <div style={{padding:10,borderBottom:`1px solid ${C.border}`}}>
            <button onClick={newSession} style={{display:'flex',alignItems:'center',gap:8,width:'100%',padding:'9px 12px',borderRadius:9,fontSize:13,fontWeight:500,color:C.textSec,border:`1px solid ${C.border}`,transition:'all 0.2s'}}
              onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.05)';e.currentTarget.style.color=C.textPrimary}}
              onMouseLeave={e=>{e.currentTarget.style.background='';e.currentTarget.style.color=C.textSec}}>
              <Icon name="plus" size={14}/>新しいチャット
            </button>
          </div>
          <div style={{flex:1,overflowY:'auto',padding:'8px 6px'}}>
            {groups.map(g=>(
              <div key={g.label} style={{marginBottom:14}}>
                <div style={{fontSize:10,fontWeight:700,color:'#334155',padding:'0 8px 5px',textTransform:'uppercase',letterSpacing:'0.07em'}}>{g.label}</div>
                {g.items.map(sess=>{
                  const active=sess.id===currId
                  const exCount=(sessionExtractions[sess.id]||[]).length
                  return (
                    <div key={sess.id}
                      onClick={()=>editId!==sess.id&&switchSession(sess.id)}
                      onMouseEnter={()=>setHoverId(sess.id)} onMouseLeave={()=>setHoverId(null)}
                      style={{display:'flex',alignItems:'center',gap:7,padding:'8px 10px',borderRadius:8,cursor:'pointer',marginBottom:1,transition:'all 0.15s',background:active?'rgba(255,255,255,0.08)':'transparent',color:active?C.textPrimary:C.textMuted}}>
                      <Icon name="msg" size={13} style={{flexShrink:0,opacity:0.55}}/>
                      {editId===sess.id ? (
                        <input autoFocus value={editTitle} onChange={e=>setEditTitle(e.target.value)}
                          onKeyDown={e=>{if(e.key==='Enter'){setSessions(p=>p.map(s=>s.id===sess.id?{...s,title:editTitle.trim()||s.title}:s));setEditId(null)}if(e.key==='Escape')setEditId(null)}}
                          onBlur={()=>{setSessions(p=>p.map(s=>s.id===sess.id?{...s,title:editTitle.trim()||s.title}:s));setEditId(null)}}
                          onClick={e=>e.stopPropagation()}
                          style={{flex:1,background:'transparent',border:'none',borderBottom:'1px solid #3b82f6',color:C.textPrimary,fontSize:13,outline:'none',paddingBottom:1}}/>
                      ):(
                        <span style={{flex:1,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sess.title}</span>
                      )}
                      {exCount>0 && editId!==sess.id && hoverId!==sess.id && (
                        <div style={{fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:10,background:'rgba(37,99,235,0.2)',color:'#60a5fa',flexShrink:0}}>{exCount}</div>
                      )}
                      {(hoverId===sess.id||active)&&editId!==sess.id&&(
                        <div style={{display:'flex',gap:1}} onClick={e=>e.stopPropagation()}>
                          <button onClick={e=>{e.stopPropagation();setEditTitle(sess.title);setEditId(sess.id)}} style={{padding:3,borderRadius:4,color:C.textMuted}}
                            onMouseEnter={e=>e.currentTarget.style.color=C.textSec} onMouseLeave={e=>e.currentTarget.style.color=C.textMuted}>
                            <Icon name="pencil" size={12}/>
                          </button>
                          <button onClick={e=>delSession(sess.id,e)} style={{padding:3,borderRadius:4,color:C.textMuted}}
                            onMouseEnter={e=>e.currentTarget.style.color='#f87171'} onMouseLeave={e=>e.currentTarget.style.color=C.textMuted}>
                            <Icon name="trash" size={12}/>
                          </button>
                        </div>
                      )}
                    </div>
                  )
                })}
              </div>
            ))}
          </div>
        </aside>

        {/* ── Chat Main ── */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
          {/* Toolbar */}
          <div style={{padding:'8px 16px',borderBottom:`1px solid rgba(255,255,255,0.04)`,display:'flex',alignItems:'center',gap:8,justifyContent:'flex-end'}}>
            <button onClick={()=>setCompareQuery('京都の混雑を避けるコツは？')} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:8,fontSize:12,fontWeight:600,border:'1px solid rgba(37,99,235,0.28)',background:'rgba(37,99,235,0.07)',color:'#60a5fa',transition:'all 0.2s'}}
              onMouseEnter={e=>{e.currentTarget.style.background='rgba(37,99,235,0.14)'}}
              onMouseLeave={e=>{e.currentTarget.style.background='rgba(37,99,235,0.07)'}}>
              <Icon name="columns" size={13}/>RAG比較
            </button>
            <button onClick={()=>setShowPanel(v=>!v)} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:8,fontSize:12,fontWeight:600,transition:'all 0.2s',border:`1px solid ${showPanel?'rgba(16,185,129,0.3)':C.border}`,background:showPanel?'rgba(16,185,129,0.08)':'transparent',color:showPanel?'#34d399':C.textMuted}}
              onMouseEnter={e=>{e.currentTarget.style.opacity='0.8'}} onMouseLeave={e=>{e.currentTarget.style.opacity='1'}}>
              <Icon name="sparkle" size={13}/>抽出データ {showPanel?'非表示':'表示'}
            </button>
          </div>

          <div style={{flex:1,display:'flex',overflow:'hidden'}}>
            {/* Messages */}
            <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'20px 0',minWidth:0}}>
              <div style={{maxWidth:640,margin:'0 auto',padding:'0 16px'}}>
                {msgs.map((m,i)=>(
                  <div key={i} className="msg-in" style={{display:'flex',gap:10,marginBottom:16,flexDirection:m.role==='user'?'row-reverse':'row'}}>
                    {m.role==='assistant'&&(
                      <div style={{width:30,height:30,borderRadius:9,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2,boxShadow:`0 0 10px ${C.accentGlow}`}}>
                        <Icon name="brain" size={14} style={{color:'#fff'}}/>
                      </div>
                    )}
                    <div style={{maxWidth:'76%'}}>
                      <div style={{padding:'11px 15px',fontSize:14,lineHeight:1.7,color:'#cbd5e1',...(m.role==='assistant'?{background:'#111',border:'1px solid rgba(255,255,255,0.06)',borderRadius:14,borderTopLeftRadius:4}:{background:'rgba(37,99,235,0.13)',border:'1px solid rgba(37,99,235,0.22)',borderRadius:14,borderTopRightRadius:4})}}>
                        <p style={{whiteSpace:'pre-wrap'}}>{m.content}</p>
                        {m.time&&<div style={{fontSize:11,color:C.textMuted,marginTop:6}}>{m.time}</div>}
                      </div>
                      {/* 抽出バッジ */}
                      {m.role==='assistant' && (m.extractions||[]).length>0 && (
                        <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:7}}>
                          {(m.extractions||[]).map(id=>{
                            const ex=allExtractions[id]; if(!ex) return null
                            const meta=CAT_META[ex.category]||{label:ex.category,color:'#64748b',bg:'rgba(100,116,139,0.1)',icon:'sparkle'}
                            return (
                              <div key={id} className="badge-pop" style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',borderRadius:20,background:meta.bg,border:`1px solid ${meta.color}30`,fontSize:11,color:meta.color}}>
                                <Icon name={meta.icon} size={10}/>
                                <span style={{fontWeight:600}}>{meta.label}</span>
                                <span style={{opacity:0.7,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                  {ex.data.name||ex.data.type||ex.data.content?.slice(0,12)||''}
                                </span>
                              </div>
                            )
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                {loading&&(
                  <div style={{display:'flex',gap:10,marginBottom:16}}>
                    <div style={{width:30,height:30,borderRadius:9,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2,boxShadow:`0 0 10px ${C.accentGlow}`}}>
                      <Icon name="brain" size={14} style={{color:'#fff'}}/>
                    </div>
                    <div style={{padding:'13px 16px',borderRadius:14,borderTopLeftRadius:4,background:'#111',border:'1px solid rgba(255,255,255,0.06)',display:'flex',gap:5,alignItems:'center'}}>
                      <div className="dot1" style={{width:7,height:7,borderRadius:'50%',background:'#3b82f6'}}/>
                      <div className="dot2" style={{width:7,height:7,borderRadius:'50%',background:'#3b82f6'}}/>
                      <div className="dot3" style={{width:7,height:7,borderRadius:'50%',background:'#3b82f6'}}/>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* ── Extraction Panel ── */}
            {showPanel&&(
              <div className="panel-slide" style={{width:240,flexShrink:0,borderLeft:`1px solid ${C.border}`,display:'flex',flexDirection:'column',background:'#0c0c0c',overflow:'hidden'}}>
                <div style={{padding:'12px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:7}}>
                  <Icon name="sparkle" size={13} style={{color:'#10b981'}}/>
                  <span style={{fontSize:12,fontWeight:700,color:C.textSec}}>抽出データ</span>
                  <div style={{marginLeft:'auto',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10,background:'rgba(16,185,129,0.1)',color:'#34d399'}}>{currExtractionIds.length}</div>
                </div>
                <div style={{flex:1,overflowY:'auto',padding:10}}>
                  <ExtractionPanel extractions={currExtractionIds} allExtractions={allExtractions}/>
                </div>
                {/* RAG compare shortcut inside panel */}
                <div style={{padding:10,borderTop:`1px solid ${C.border}`}}>
                  <button onClick={()=>setCompareQuery(msgs.find(m=>m.role==='user')?.content||'旅行について')} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:'8px 0',borderRadius:9,fontSize:12,fontWeight:600,background:'rgba(37,99,235,0.08)',border:'1px solid rgba(37,99,235,0.2)',color:'#60a5fa',transition:'all 0.2s'}}
                    onMouseEnter={e=>e.currentTarget.style.background='rgba(37,99,235,0.15)'}
                    onMouseLeave={e=>e.currentTarget.style.background='rgba(37,99,235,0.08)'}>
                    <Icon name="columns" size={13}/>RAG効果を比較
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Input */}
          <div style={{padding:'10px 16px 18px',borderTop:`1px solid rgba(255,255,255,0.04)`}}>
            <div style={{maxWidth:640,margin:'0 auto'}}>
              <div style={{display:'flex',alignItems:'flex-end',gap:8,background:'#111',border:'1px solid rgba(255,255,255,0.09)',borderRadius:14,padding:8}}>
                <textarea ref={taRef} value={input} onChange={e=>setInput(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}}}
                  placeholder="旅行について話してください... (Shift+Enter で改行)"
                  disabled={loading} rows={1}
                  style={{flex:1,background:'transparent',border:'none',outline:'none',color:C.textPrimary,fontSize:14,lineHeight:1.6,resize:'none',padding:'8px 10px',minHeight:40,maxHeight:160}}/>
                <button onClick={handleSend} disabled={!input.trim()||loading} style={{width:36,height:36,borderRadius:9,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'#fff',marginBottom:1,transition:'all 0.2s',opacity:(!input.trim()||loading)?0.35:1,boxShadow:input.trim()?`0 0 12px ${C.accentGlow}`:'none'}}>
                  <Icon name="send" size={15}/>
                </button>
              </div>
              <div style={{textAlign:'center',fontSize:11,color:'#2d3748',marginTop:7,letterSpacing:'0.03em'}}>
                会話から旅行データを自動抽出し、RAGの精度を継続的に向上させます
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  )
}

/* ─── TOGGLE SWITCH ───────────────────────────────────────── */
function Toggle({on, onChange}) {
  return (
    <button onClick={()=>onChange(!on)} style={{
      width:36, height:20, borderRadius:10, position:'relative', flexShrink:0,
      background: on ? '#2563eb' : 'rgba(255,255,255,0.1)',
      border: on ? '1px solid #3b82f6' : '1px solid rgba(255,255,255,0.1)',
      transition:'all 0.2s', boxShadow: on ? '0 0 8px rgba(37,99,235,0.4)' : 'none',
    }}>
      <div style={{
        position:'absolute', top:2, left: on ? 17 : 2,
        width:14, height:14, borderRadius:'50%',
        background: on ? '#fff' : 'rgba(255,255,255,0.5)',
        transition:'left 0.2s',
      }}/>
    </button>
  )
}

/* ─── SOURCE BADGE ────────────────────────────────────────── */
function SourceBadge({source}) {
  const map = {
    chat:   {label:'chat',   color:'#8b5cf6', bg:'rgba(139,92,246,0.1)'},
    upload: {label:'upload', color:'#06b6d4', bg:'rgba(6,182,212,0.1)'},
    manual: {label:'manual', color:'#f59e0b', bg:'rgba(245,158,11,0.1)'},
  }
  const s = map[source]||map.manual
  return (
    <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,color:s.color,background:s.bg,letterSpacing:'0.04em',textTransform:'uppercase'}}>
      {s.label}
    </span>
  )
}

  const [query, setQuery]     = useState('')
  const [results, setResults] = useState(null)
  const [searching, setSearching] = useState(false)
  const [hoverPt, setHoverPt] = useState(null)
  const [urlInput, setUrlInput] = useState('')
  const [urlTitle, setUrlTitle] = useState('')
  const [urlLoading, setUrlLoading] = useState(false)
  const [showUrlForm, setShowUrlForm] = useState(false)

  const toggleDoc = id => setDocs(p => p.map(d => d.id===id ? {...d, is_active:!d.is_active} : d))
  const deleteDoc = id => setDocs(p => p.filter(d => d.id!==id))

  const addUrl = () => {
    if(!urlInput.trim()||!urlTitle.trim()) return
    setUrlLoading(true)
    setTimeout(()=>{
      const id = 'du' + Date.now()
      setDocs(p=>[{
        id, title:urlTitle, source:'upload', status:'processing',
        chunks:null, is_active:true, date:'2026/05/01', size:'—',
        url:urlInput,
      },...p])
      setUrlInput(''); setUrlTitle(''); setUrlLoading(false); setShowUrlForm(false)
      /* 処理完了をシミュレート */
      setTimeout(()=>{
        setDocs(p=>p.map(d=>d.id===id?{...d,status:'vectorized',chunks:Math.floor(Math.random()*30)+8}:d))
      },2800)
    },1200)
  }

  const doSearch = () => {
    if(!query.trim()) return
    setSearching(true); setResults(null)
    setTimeout(()=>{ setSearching(false); setResults(SEARCH_RESULTS) }, 1100)
  }

  const statusInfo = s => ({
    vectorized: {label:'完了',      color:'#10b981', bg:'rgba(16,185,129,0.1)'},

    pending:    {label:'待機中',    color:'#475569', bg:'rgba(71,85,105,0.1)'},

  const activeCount = docs.filter(d=>d.is_active&&d.status==='vectorized').length

    {id:'docs',    label:'RAGデータ管理', icon:'db'},

    {id:'search',  label:'検索テスト',    icon:'search'},

              <Icon name="sparkle" size={17}/>
            </div>
            <h1 style={{fontSize:22,fontWeight:800,color:C.textPrimary,letterSpacing:'-0.02em'}}>学習管理</h1>
          </div>
          <p style={{fontSize:13,color:C.textMuted}}>RAGデータの管理・ON/OFF切り替え、ベクトル可視化、検索テストができます</p>
        </div>

        {/* Stats */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:28}}>
          {[
            {label:'全ドキュメント',  value:String(docs.length),      sub:`${docs.filter(d=>d.status==='vectorized').length} 完了`, color:'#3b82f6'},
            {label:'RAG有効',         value:String(activeCount),       sub:'ベクトル検索対象', color:'#10b981'},
            {label:'総チャンク数',    value:String(totalChunks),       sub:'有効ドキュメントのみ', color:'#8b5cf6'},
            {label:'クラスター数',    value:'5',                        sub:CLUSTERS.map(c=>c.label).join('・'), color:'#f59e0b'},
          ].map(st=>(
            <div key={st.label} style={{padding:'16px 18px',borderRadius:14,background:C.card,border:`1px solid ${C.border}`}}>

            </div>

            {/* File drop zone */}
            <div style={{border:'2px dashed rgba(37,99,235,0.22)',borderRadius:14,padding:'22px 24px',textAlign:'center',marginBottom:14,background:'rgba(37,99,235,0.02)',cursor:'pointer',transition:'all 0.2s'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(37,99,235,0.45)';e.currentTarget.style.background='rgba(37,99,235,0.04)'}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(37,99,235,0.22)';e.currentTarget.style.background='rgba(37,99,235,0.02)'}}>
              <div style={{width:38,height:38,borderRadius:10,background:'rgba(37,99,235,0.1)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 8px',color:'#3b82f6'}}>
                <Icon name="upload" size={17}/>
              </div>
              <div style={{fontWeight:600,color:C.textPrimary,marginBottom:2,fontSize:13}}>ファイルをドロップ、またはクリックして選択</div>
              <div style={{fontSize:12,color:C.textMuted}}>PDF, TXT, MD — 最大 10MB</div>
            </div>

            {/* 凡例 */}
            <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:10,padding:'0 2px'}}>
              <div style={{fontSize:11,color:C.textMuted,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>RAG ON/OFF で検索対象を制御</div>
              <div style={{flex:1,height:1,background:C.border}}/>
              <div style={{display:'flex',gap:10}}>
                {['chat','upload','manual'].map(s=><SourceBadge key={s} source={s}/>)}
              </div>
            </div>

            {/* Doc list */}
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {docs.map(doc=>{
                const si=statusInfo(doc.status)
                return (
                  <div key={doc.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderRadius:12,background:C.card,border:`1px solid ${doc.is_active?'rgba(255,255,255,0.09)':C.border}`,transition:'all 0.2s',opacity:doc.is_active?1:0.55}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor=doc.is_active?'rgba(255,255,255,0.16)':C.borderHover}
                    onMouseLeave={e=>e.currentTarget.style.borderColor=doc.is_active?'rgba(255,255,255,0.09)':C.border}>
                    {/* Toggle */}
                    <Toggle on={doc.is_active} onChange={()=>toggleDoc(doc.id)}/>
                    {/* Icon */}
                    <div style={{color:doc.is_active?'#3b82f6':'#334155'}}><Icon name={doc.source==='chat'?'msg':'file'} size={16}/></div>
                    {/* Info */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:2}}>
                        <span style={{fontSize:13,fontWeight:500,color:doc.is_active?C.textPrimary:C.textMuted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.title}</span>
                        <SourceBadge source={doc.source}/>
                      </div>
                      <div style={{fontSize:11,color:C.textMuted}}>
                        {doc.url&&<span style={{color:'#3b82f6',marginRight:6}}><Icon name="link" size={10} style={{display:'inline',verticalAlign:'middle'}}/> URL</span>}
                        {doc.size} · {doc.date}
                        {doc.chunks&&<span style={{marginLeft:6}}>{doc.chunks} chunks</span>}
                      </div>
                    </div>
                    {/* Status */}
                    <div style={{fontSize:11,fontWeight:600,padding:'3px 9px',borderRadius:20,color:si.color,background:si.bg,flexShrink:0}}>
                      {si.label==='処理中'&&<span className="spin" style={{display:'inline-block',marginRight:4,width:8,height:8,border:'1.5px solid currentColor',borderTopColor:'transparent',borderRadius:'50%'}}/>}
                      {si.label}
                    </div>
                    {/* Delete */}
                    <button onClick={()=>deleteDoc(doc.id)} style={{color:'#2d3748',padding:4,borderRadius:6,transition:'color 0.15s',flexShrink:0}}
                      onMouseEnter={e=>e.currentTarget.style.color='#f87171'} onMouseLeave={e=>e.currentTarget.style.color='#2d3748'}>
                      <Icon name="trash" size={14}/>
                    </button>
                  </div>
                )
              })}
            </div>

            {/* RAG filter hint */}
            <div style={{marginTop:14,padding:'12px 16px',borderRadius:10,background:'rgba(37,99,235,0.04)',border:'1px solid rgba(37,99,235,0.12)',display:'flex',gap:10,alignItems:'flex-start'}}>
              <Icon name="info" size={14} style={{color:'#3b82f6',flexShrink:0,marginTop:1}}/>
              <div style={{fontSize:12,color:C.textSec,lineHeight:1.65}}>
                RAGをONにしたドキュメントのみがChromaDB検索の対象になります。<br/>
                <code style={{fontSize:11,background:'rgba(255,255,255,0.06)',padding:'1px 5px',borderRadius:4,color:'#a5b4fc'}}>is_active=True</code> のドキュメントIDをフィルタとしてChromaDBに渡します。
              </div>
            </div>
          </div>
        )}

        {/* ── VECTORS TAB ── */}
        {tab==='vectors'&&(
          <div style={{display:'grid',gridTemplateColumns:'1fr 220px',gap:18}}>
            <div style={{border:`1px solid ${C.border}`,borderRadius:16,background:'rgba(255,255,255,0.01)',padding:22}}>
              <div style={{fontSize:12,fontWeight:600,color:C.textMuted,marginBottom:14,textTransform:'uppercase',letterSpacing:'0.05em'}}>ベクトル空間 — t-SNE 2D投影</div>
              <svg width="100%" viewBox="0 0 380 280" style={{display:'block'}}>
                {[0,1,2,3,4,5].map(i=><line key={'h'+i} x1={0} y1={i*47} x2={380} y2={i*47} stroke="rgba(255,255,255,0.035)" strokeWidth={1}/>)}
                {[0,1,2,3,4,5,6].map(i=><line key={'v'+i} x1={i*54} y1={0} x2={i*54} y2={280} stroke="rgba(255,255,255,0.035)" strokeWidth={1}/>)}
                {CLUSTERS.map(cl=>(
                  <ellipse key={cl.label} cx={cl.cx} cy={cl.cy} rx={34} ry={27}
                    fill={cl.color} fillOpacity={0.06} stroke={cl.color} strokeOpacity={0.18} strokeWidth={1}/>
                ))}
                {VPOINTS.map((pt,i)=>(
                  <circle key={i} cx={pt.x} cy={pt.y} r={hoverPt===i?7:4.5}
                    fill={pt.color} fillOpacity={0.88} stroke="#0a0a0a" strokeWidth={1}
                    style={{cursor:'pointer',transition:'r 0.1s'}}
                    onMouseEnter={()=>setHoverPt(i)} onMouseLeave={()=>setHoverPt(null)}/>
                ))}
                {CLUSTERS.map(cl=>(
                  <text key={cl.label} x={cl.cx} y={cl.cy-38} textAnchor="middle"
                    fill={cl.color} fontSize={11} fontWeight={700} fontFamily="DM Sans,sans-serif">{cl.label}</text>
                ))}
                {hoverPt!==null&&(()=>{
                  const pt=VPOINTS[hoverPt]
                  return (
                    <g>
                      <rect x={pt.x+12} y={pt.y-22} width={50} height={18} rx={4} fill="#1e293b" stroke="rgba(255,255,255,0.1)" strokeWidth={1}/>
                      <text x={pt.x+37} y={pt.y-9} textAnchor="middle" fill="#e2e8f0" fontSize={10} fontFamily="DM Sans,sans-serif">{pt.label}</text>
                    </g>
                  )
                })()}
              </svg>
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:600,color:C.textMuted,marginBottom:12,textTransform:'uppercase',letterSpacing:'0.05em'}}>クラスター</div>
              {CLUSTERS.map(cl=>(
                <div key={cl.label} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',borderRadius:10,border:`1px solid ${C.border}`,background:C.card,marginBottom:7}}>
                  <div style={{width:9,height:9,borderRadius:'50%',background:cl.color,flexShrink:0,boxShadow:`0 0 6px ${cl.color}`}}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:C.textPrimary}}>{cl.label}</div>
                    <div style={{fontSize:11,color:C.textMuted}}>{cl.n} vectors</div>
                  </div>
                </div>
              ))}
              <div style={{marginTop:14,padding:'12px 14px',borderRadius:10,background:'rgba(37,99,235,0.06)',border:'1px solid rgba(37,99,235,0.15)',fontSize:12,color:C.textSec,lineHeight:1.65}}>
                <span style={{color:'#60a5fa',fontWeight:600}}>RAG検索</span>はクエリをベクトル化し、最も類似したクラスター内の文書を参照します。
              </div>
            </div>
          </div>
        )}

        {/* ── SEARCH TAB ── */}
        {tab==='search'&&(
          <div>
            {/* Active doc filter note */}
            <div style={{marginBottom:14,padding:'10px 14px',borderRadius:10,background:'rgba(16,185,129,0.04)',border:'1px solid rgba(16,185,129,0.15)',display:'flex',gap:8,alignItems:'center'}}>
              <Icon name="db" size={13} style={{color:'#10b981',flexShrink:0}}/>
              <span style={{fontSize:12,color:'#6ee7b7'}}>
                RAG ON のドキュメント <strong>{docs.filter(d=>d.is_active&&d.status==='vectorized').map(d=>d.title).join('・')}</strong> が検索対象です
              </span>
            </div>
            <div style={{display:'flex',gap:10,marginBottom:24}}>
              <div style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'rgba(255,255,255,0.03)',border:`1px solid ${C.border}`,borderRadius:12,padding:'0 14px'}}>
                <Icon name="search" size={15} style={{color:C.textMuted,flexShrink:0}}/>
                <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()}
                  placeholder="例: 京都の混雑を避けるコツは？"
                  style={{flex:1,background:'transparent',border:'none',outline:'none',color:C.textPrimary,fontSize:14,padding:'13px 0'}}/>
              </div>
              <button onClick={doSearch} style={{padding:'0 22px',background:C.accent,color:'#fff',fontWeight:700,fontSize:14,borderRadius:12,boxShadow:`0 0 16px ${C.accentGlow}`}}>検索</button>
            </div>
            {searching&&(
              <div style={{textAlign:'center',padding:'48px 0'}}>
                <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:14}}>
                  <div className="dot1" style={{width:8,height:8,borderRadius:'50%',background:'#3b82f6'}}/>
                  <div className="dot2" style={{width:8,height:8,borderRadius:'50%',background:'#3b82f6'}}/>
                  <div className="dot3" style={{width:8,height:8,borderRadius:'50%',background:'#3b82f6'}}/>
                </div>
                <div style={{fontSize:13,color:C.textMuted}}>ChromaDBをベクトル検索中...</div>
              </div>
            )}
            {results&&!searching&&(
              <div>
                <div style={{fontSize:13,color:C.textMuted,marginBottom:16}}>
                  <span style={{color:'#3b82f6',fontWeight:700}}>{results.length}</span> 件の類似チャンクが見つかりました
                </div>
                {results.map((r,i)=>(
                  <div key={i} style={{padding:'16px 18px',borderRadius:14,marginBottom:10,background:C.card,border:`1px solid ${C.border}`,transition:'all 0.2s'}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor=C.borderHover}
                    onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <Icon name="file" size={13} style={{color:'#3b82f6'}}/>
                        <span style={{fontSize:12,fontWeight:600,color:'#60a5fa'}}>{r.doc}</span>
                        <SourceBadge source={r.source}/>
                      </div>
                      <div style={{fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:20,background:'rgba(16,185,129,0.1)',color:'#10b981'}}>
                        {(r.score*100).toFixed(0)}% 一致
                      </div>
                    </div>
                    <p style={{fontSize:13,color:C.textSec,lineHeight:1.7}}>{r.chunk}</p>
                  </div>
                ))}
              </div>
            )}
            {!searching&&!results&&(
              <div style={{textAlign:'center',padding:'60px 24px',border:'1px dashed rgba(255,255,255,0.06)',borderRadius:16,color:'#2d3748'}}>
                <Icon name="search" size={32} style={{margin:'0 auto 14px',opacity:0.3}}/>
                <div style={{fontSize:14}}>クエリを入力してRAG検索をテストできます</div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  )
}

/* ─── APP ─────────────────────────────────────────────────── */
function App() {
  const [page,setPage] = useState('login')
  const [user,setUser] = useState(null)
  const handleLogin = u => { setUser(u); setPage('home') }
  const handleNav   = p => { if(p==='login') setUser(null); setPage(p) }

  if(page==='login') return <LoginPage onLogin={handleLogin}/>
  return (
    <div style={{height:'100vh',background:C.bg}}>
      <Header page={page} onNav={handleNav} user={user}/>
      {page==='home'     && <HomePage     onNav={handleNav}/>}
      {page==='chat'     && <ChatPage/>}
      {page==='learning' && <LearningPage/>}
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
